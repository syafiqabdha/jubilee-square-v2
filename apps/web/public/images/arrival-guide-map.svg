<!--
  Stylized wayfinding map showing the path from Ang Mo Kio MRT Exit C to Jubilee Square.
  4 interactive landmarks: Linkway → Facade → Entrance → Carpark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Wayfinding map: Ang Mo Kio MRT Exit C to Jubilee Square with 4 landmark waypoints">
  <defs>
    <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a7c59"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" rx="0"/>

  <!-- Street Grid (subtle) -->
  <g stroke="#e2e8f0" stroke-width="1" fill="none" opacity="0.6">
    <!-- Ang Mo Kio Ave 8 (vertical, right side) -->
    <line x1="620" y1="0" x2="620" y2="500" stroke-width="4"/>
    <!-- AMK Road (horizontal, bottom) -->
    <line x1="0" y1="440" x2="620" y2="440" stroke-width="4"/>
    <!-- Linkway corridor (horizontal, mid) -->
    <line x1="80" y1="250" x2="400" y2="250" stroke-width="3" stroke="#94a3b8" stroke-dasharray="8,4"/>
  </g>

  <!-- Street Labels -->
  <text x="628" y="480" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="600" transform="rotate(-90, 628, 480)">Ang Mo Kio Ave 8</text>
  <text x="300" y="460" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="600">AMK Road</text>

  <!-- Bus Interchange (top-right area) -->
  <rect x="520" y="60" width="160" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569" font-weight="700">Bus Interchange</text>
  <text x="600" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Services 22, 24, 25, 73…</text>

  <!-- MRT Station (top-left area) -->
  <rect x="60" y="60" width="140" height="80" rx="8" fill="#1e3a5f" stroke="#1e3a5f"/>
  <text x="130" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="800">Ang Mo Kio MRT</text>
  <text x="130" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#93c5fd">NS16 · North-South Line</text>
  <text x="130" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#bfdbfe">Exit C →</text>

  <!-- Path: MRT Exit C to Linkway -->
  <path d="M 180 140 Q 250 180 300 230" fill="none" stroke="#4a7c59" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <text x="240" y="185" font-family="system-ui, sans-serif" font-size="9" fill="#4a7c59" font-weight="600">Exit C</text>

  <!-- Sheltered Linkway (main corridor) -->
  <rect x="140" y="230" width="340" height="40" rx="6" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="310" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#065f46" font-weight="700">Sheltered Linkway (2 min walk)</text>

  <!-- Path: Linkway to Facade -->
  <path d="M 480 250 Q 520 240 560 220" fill="none" stroke="#4a7c59" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <text x="510" y="230" font-family="system-ui, sans-serif" font-size="9" fill="#4a7c59" font-weight="600">→</text>

  <!-- Jubilee Square Building (right side) -->
  <rect x="540" y="140" width="200" height="220" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="540" y="140" width="200" height="30" rx="10" fill="#1e3a5f"/>
  <text x="640" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="800">JUBILEE SQUARE</text>
  <!-- Facade triangles (stylized) -->
  <polygon points="560,200 580,230 540,230" fill="#C60A4D" opacity="0.85"/>
  <polygon points="590,200 610,230 570,230" fill="#f59e0b" opacity="0.85"/>
  <polygon points="620,200 640,230 600,230" fill="#10b981" opacity="0.85"/>
  <polygon points="650,200 670,230 630,230" fill="#3b82f6" opacity="0.85"/>
  <polygon points="680,200 700,230 660,230" fill="#8b5cf6" opacity="0.85"/>
  <!-- Windows -->
  <g fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5">
    <rect x="555" y="250" width="30" height="20" rx="2"/>
    <rect x="595" y="250" width="30" height="20" rx="2"/>
    <rect x="635" y="250" width="30" height="20" rx="2"/>
    <rect x="675" y="250" width="30" height="20" rx="2"/>
    <rect x="555" y="290" width="30" height="20" rx="2"/>
    <rect x="595" y="290" width="30" height="20" rx="2"/>
    <rect x="635" y="290" width="30" height="20" rx="2"/>
    <rect x="675" y="290" width="30" height="20" rx="2"/>
    <rect x="555" y="330" width="30" height="20" rx="2"/>
    <rect x="595" y="330" width="30" height="20" rx="2"/>
    <rect x="635" y="330" width="30" height="20" rx="2"/>
    <rect x="675" y="330" width="30" height="20" rx="2"/>
  </g>
  <!-- Main Entrance -->
  <rect x="610" y="340" width="60" height="18" rx="3" fill="#10b981" stroke="#059669" stroke-width="1"/>
  <text x="640" y="353" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff" font-weight="700">ENTRANCE</text>
  <!-- Carpark access (bottom right of building) -->
  <rect x="680" y="340" width="50" height="18" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <text x="705" y="353" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#ffffff" font-weight="700">CARPARK</text>

  <!-- Path: Linkway to Ground Level (down from linkway end) -->
  <path d="M 480 250 Q 500 300 560 350" fill="none" stroke="#4a7c59" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ===== WAYPOINT MARKERS ===== -->
  <!-- WP1: Linkway (on the linkway itself) -->
  <g class="wp1" filter="url(#glow)">
    <circle cx="310" cy="250" r="18" fill="#1e3a5f" opacity="0.25">
      <animate attributeName="r" values="18;24;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.1;0.25" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="250" r="14" fill="#1e3a5f" stroke="#ffffff" stroke-width="2.5"/>
    <text x="310" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="900">1</text>
    <rect x="240" y="215" width="140" height="22" rx="4" fill="#1e3a5f" opacity="0.9"/>
    <text x="310" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" font-weight="600">🚇 MRT Exit C</text>
  </g>

  <!-- WP2: Rainbow Facade (on building top) -->
  <g class="wp2" filter="url(#glow)">
    <circle cx="640" cy="175" r="18" fill="#C60A4D" opacity="0.25">
      <animate attributeName="r" values="18;24;18" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.25;0.1;0.25" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="640" cy="175" r="14" fill="#C60A4D" stroke="#ffffff" stroke-width="2.5"/>
    <text x="640" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="900">2</text>
    <rect x="545" y="148" width="100" height="22" rx="4" fill="#C60A4D" opacity="0.9"/>
    <text x="595" y="163" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" font-weight="600">🎨 Rainbow Facade</text>
  </g>

  <!-- WP3: Main Entrance (green) -->
  <g class="wp3" filter="url(#glow)">
    <circle cx="640" cy="355" r="18" fill="#10b981" opacity="0.25">
      <animate attributeName="r" values="18;24;18" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.25;0.1;0.25" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="640" cy="355" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
    <text x="640" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="900">3</text>
    <rect x="555" y="378" width="110" height="22" rx="4" fill="#10b981" opacity="0.9"/>
    <text x="610" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" font-weight="600">🚪 Main Entrance</text>
  </g>

  <!-- WP4: Carpark (amber) -->
  <g class="wp4" filter="url(#glow)">
    <circle cx="710" cy="355" r="18" fill="#f59e0b" opacity="0.25">
      <animate attributeName="r" values="18;24;18" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.25;0.1;0.25" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="710" cy="355" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5"/>
    <text x="710" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="900">4</text>
    <rect x="655" y="378" width="110" height="22" rx="4" fill="#f59e0b" opacity="0.9"/>
    <text x="710" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" font-weight="600">🚗 Carpark Access</text>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 420)">
    <rect x="0" y="0" width="220" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="22" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" font-weight="700" letter-spacing="0.05em">LANDMARKS</text>
    <circle cx="20" cy="38" r="7" fill="#1e3a5f"/><text x="35" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#334155">MRT Exit C → Linkway</text>
    <circle cx="20" cy="54" r="7" fill="#C60A4D"/><text x="35" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Rainbow Geometric Facade</text>
    <circle cx="110" cy="38" r="7" fill="#10b981"/><text x="125" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Main Entrance</text>
    <circle cx="110" cy="54" r="7" fill="#f59e0b"/><text x="125" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Carpark &amp; Drop-off</text>
  </g>

  <!-- Address footer -->
  <text x="640" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">61 Ang Mo Kio Ave 8, Singapore 569814 · Stylized Wayfinding Map</text>
</svg>
